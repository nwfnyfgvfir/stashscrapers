name: compatibility
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: conda-incubator/setup-miniconda@fc2d68f6413eb2d87b895e92f8584b5b94a10167 # v3
        with:
          miniforge-version: latest
          environment-file: environment.yml
          activate-environment: stashscrapers
      - run: conda run --no-capture-output -n stashscrapers python tools/check.py --full
      - if: runner.os == 'Linux'
        run: conda install -n stashscrapers -c conda-forge gcc_linux-64 -y
      - if: runner.os == 'Linux'
        run: conda run -n stashscrapers python tools/race.py
      - run: conda run -n stashscrapers python tools/build.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: binaries-${{ runner.os }}
          path: dist/
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          load: true
          tags: stashscrapers:ci
      - uses: conda-incubator/setup-miniconda@fc2d68f6413eb2d87b895e92f8584b5b94a10167 # v3
        with:
          miniforge-version: latest
          environment-file: environment.yml
          activate-environment: stashscrapers
      - run: conda run -n stashscrapers python tools/container_smoke.py
