name: daily-engine-upgrade
on:
  schedule:
    - cron: '25 1 * * *'
  workflow_dispatch:
permissions:
  contents: write
  packages: write
concurrency:
  group: engine-upgrade
  cancel-in-progress: false
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: conda-incubator/setup-miniconda@fc2d68f6413eb2d87b895e92f8584b5b94a10167 # v3
        with:
          miniforge-version: latest
          environment-file: environment.yml
          activate-environment: stashscrapers
      - name: Extract latest engine and replay patches
        id: follow
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: conda run --no-capture-output -n stashscrapers python tools/follow_engine.py
      - if: steps.follow.outputs.changed == 'true'
        run: conda run --no-capture-output -n stashscrapers python tools/check.py --full
      - if: steps.follow.outputs.changed == 'true'
        run: conda install -n stashscrapers -c conda-forge gcc_linux-64 -y
      - if: steps.follow.outputs.changed == 'true'
        run: conda run -n stashscrapers python tools/race.py
      - if: steps.follow.outputs.changed == 'true'
        run: conda run -n stashscrapers python tools/build.py
      - if: steps.follow.outputs.changed == 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: engine-candidate-${{ steps.follow.outputs.sha }}
          path: dist/
      - name: Publish only when repository automation is enabled
        id: release
        if: steps.follow.outputs.changed == 'true' && vars.AUTO_RELEASE_ENGINE == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ENGINE_SHA: ${{ steps.follow.outputs.sha }}
        run: conda run -n stashscrapers python tools/publish_release.py
      - if: steps.follow.outputs.changed == 'true' && vars.AUTO_RELEASE_ENGINE == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - if: steps.follow.outputs.changed == 'true' && vars.AUTO_RELEASE_ENGINE == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: steps.follow.outputs.changed == 'true' && vars.AUTO_RELEASE_ENGINE == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/${{ github.repository }}:latest,ghcr.io/${{ github.repository }}:${{ steps.release.outputs.tag }},ghcr.io/${{ github.repository }}:engine-${{ steps.follow.outputs.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=AGPL-3.0-only
      - name: Record blocked engine upgrade
        if: failure()
        run: echo "Engine upgrade failed. Current deployments and rule snapshots are unchanged. Inspect the failed compatibility step."
