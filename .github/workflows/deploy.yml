name: deploy-validated-engine
on:
  workflow_run:
    workflows: [daily-engine-upgrade, publish-container]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    if: vars.ENABLE_ENGINE_DEPLOY == 'true' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: [self-hosted, stashscrapers-deploy]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - env:
          STASHSCRAPERS_IMAGE: ghcr.io/${{ github.repository }}:latest
          DEPLOY_COMPOSE: ${{ vars.DEPLOY_COMPOSE }}
        run: conda run -n stashscrapers python tools/deploy.py
