name: publish-container

on:
  push:
    tags:
      - 'v*'
      - 'engine-*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag to build again, e.g. v0.1.0'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-container-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
      version: ${{ steps.meta.outputs.version }}
      tags: ${{ steps.meta.outputs.tags }}
      revision: ${{ steps.meta.outputs.revision }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: conda-incubator/setup-miniconda@fc2d68f6413eb2d87b895e92f8584b5b94a10167 # v3
        with:
          miniforge-version: latest
          environment-file: environment.yml
          activate-environment: stashscrapers
      - id: meta
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: conda run -n stashscrapers python tools/release_metadata.py
      - run: conda run --no-capture-output -n stashscrapers python tools/check.py --full
      - run: conda install -n stashscrapers -c conda-forge gcc_linux-64 -y
      - run: conda run -n stashscrapers python tools/race.py
      - run: conda run -n stashscrapers python tools/check_deployment.py

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.verify.outputs.revision }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build an amd64 candidate before publication
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          target: runtime
          platforms: linux/amd64
          load: true
          tags: stashscrapers:ci
          cache-from: type=gha,scope=release-runtime
          cache-to: type=gha,mode=max,scope=release-runtime
      - uses: conda-incubator/setup-miniconda@fc2d68f6413eb2d87b895e92f8584b5b94a10167 # v3
        with:
          miniforge-version: latest
          environment-file: environment.yml
          activate-environment: stashscrapers
      - name: Smoke test the non-root container and its data volume
        run: conda run -n stashscrapers python tools/container_smoke.py
      - name: Publish amd64 and arm64 images
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ needs.verify.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.verify.outputs.revision }}
            org.opencontainers.image.version=${{ needs.verify.outputs.version }}
            org.opencontainers.image.licenses=AGPL-3.0-only
          cache-from: type=gha,scope=release-runtime
          cache-to: type=gha,mode=max,scope=release-runtime
      - name: Record published image and deployment command
        env:
          IMAGE: ${{ needs.verify.outputs.image }}
          VERSION: ${{ needs.verify.outputs.version }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          echo "### Published container" >> "$GITHUB_STEP_SUMMARY"
          echo "Image: \`$IMAGE:$VERSION\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Digest: \`$DIGEST\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Platforms: linux/amd64, linux/arm64" >> "$GITHUB_STEP_SUMMARY"
          echo "Deployment: see deploy/README.md in this tag." >> "$GITHUB_STEP_SUMMARY"
